name: Correct supplied game loop
on:
  push:
    branches: [preview-online-challenge]
    paths: [.github/workflows/correct-user-audio.yml]
permissions:
  contents: write
jobs:
  trim-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-online-challenge
      - name: Install audio tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Accurately trim seconds 35 through 40
        env:
          SOURCE_URL: "https://sdmntpritalynorth.oaiusercontent.com/files/00000000-2bec-8246-9262-8b6e57c9482c/raw?se=2026-10-20T20%3A22%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=ae43a5f0-1266-40f0-9398-9c97d91a2b1f&skoid=061609b8-1cdb-4a5b-9e68-c7ab9a523a8f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-20T05%3A41%3A31Z&ske=2026-10-21T05%3A41%3A31Z&sks=b&skv=2026-02-06&sig=vtPkUp0AuUBlFSK8tuYs2fP4Lvlc%2BKpEJtjmkFUoePw%3D"
        run: |
          curl --fail --location --silent --show-error "$SOURCE_URL" --output /tmp/source.mp3
          ffmpeg -y -i /tmp/source.mp3 -ss 35.000 -t 5.000 -af "afade=t=in:st=0:d=1,afade=t=out:st=4:d=1" -ac 1 -ar 44100 -b:a 64k public/audio/game-session-theme.mp3
          size="$(stat -c%s public/audio/game-session-theme.mp3)"
          duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 public/audio/game-session-theme.mp3)"
          echo "verified duration=$duration size=$size"
          test "$size" -lt 100000
          awk -v d="$duration" 'BEGIN { exit !(d >= 4.9 && d <= 5.1) }'
      - name: Commit corrected loop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio/game-session-theme.mp3
          git commit -m "Correct game loop to exact seconds 35-40"
          git push origin HEAD:preview-online-challenge
