    <style>html.embedded #scientific-canvas-board > button:first-child { display: none !important; }</style>
    <script>
      const params = new URLSearchParams(location.search);
      if (params.has('embedded')) document.documentElement.classList.add('embedded');
      const requestedDiagram = params.get('diagram');
      const diagramIds = [
        'spermatogenesis-mammals', 'oogenesis-mammals',
        'virus-reproduction-bacteriophage', 'binary-fission-bacteria',
        'conjugation-bacteria', 'chlamydomonas-sexual-reproduction',
        'chlamydomonas-asexual-reproduction', 'paramecium-binary-fission',
        'paramecium-conjugation', 'euglena-longitudinal-fission',
        'alternation-of-generations', 'pistil-flower-structure',
        'dicot-embryo-development', 'fruit-structure',
        'male-reproductive-system-insect', 'female-reproductive-system-insect',
        'male-reproductive-system-human', 'mature-sperm-human',
        'ovarian-cycle-human-female',
      ];
      const diagramIndex = diagramIds.indexOf(requestedDiagram);
      if (diagramIndex >= 0) {
        const activateDiagram = () => {
          const choices = document.querySelectorAll('#scientific-canvas-board > div:first-child > div.grid > button');
          if (choices.length !== diagramIds.length) return false;
          choices[diagramIndex].click();
          return true;
        };
        const observer = new MutationObserver(() => {
          if (activateDiagram()) observer.disconnect();
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });
        window.addEventListener('load', activateDiagram);
      }
    </script>
